<style>
/* CONCEPT ONLY. Not linked from the live site.
   Reference measured 18 Sep 2026, 21st.dev minimalist-hero at 1440 by 900: 80px gutters, a 500px disc
   behind a 432 by 823 cut-out, a 128px headline that overlaps the disc edge by about 37px.
   What is Leon's and nobody else's: the disc is HIS bulb mark, traced to vector, in brand black with light
   falling across it. The rays are separate shapes, so the bulb switches on and then breathes. The headline
   is one piece of type that reads black on the page and white where it crosses the mark. Black and white
   only. LEFT-ALIGN LAW: the headline sits hard left at the brand's x. NAV LAW: brand left, WhatsApp right. */
:root{
  --ink:#141417; --grey:#6e6e73; --faint:#86868b; --paper:#f5f5f7;
  --gut:clamp(20px,5.5vw,80px);
  --H:clamp(520px,88svh,860px);
  --ease:cubic-bezier(.16,1,.3,1);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--text);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img{display:block}

.hero{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;
  background:radial-gradient(70% 80% at 62% 42%,#ffffff 0%,var(--paper) 62%,#ededf0 100%);
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}

.nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px var(--gut) 0}
.nav .brand img{height:50px;width:auto}
.nav nav{display:flex;align-items:center;gap:36px}
.nav nav a.l{font:500 14px/1 var(--text);letter-spacing:-.005em;color:var(--grey);transition:color .3s}
.nav nav a.l:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 22px;border-radius:999px;
  background:var(--ink);color:#fff;font:600 15px/1 var(--text);letter-spacing:-.01em;
  transition:transform .45s var(--ease),background .3s}
.pill:hover{transform:scale(1.035);background:#000}
.pill svg{width:17px;height:17px}

/* THE STAGE. Bulb, then headline, then Leon. The order is the depth. */
.stage{position:absolute;left:56%;bottom:0;width:var(--H);height:var(--H);transform:translateX(-50%);pointer-events:none}
.bulbwrap{position:absolute;z-index:1;top:10%;left:50%;width:100%;margin-left:-40%;will-change:transform}
.bulb{display:block;width:100%;height:auto;overflow:visible}
.leon{position:absolute;z-index:3;bottom:0;left:50%;height:90%;width:auto;transform:translateX(-50%);will-change:transform}
/* where he meets the bottom edge he settles into the page, never a hard crop. Full width, so the fade has no ends */
.hero:after{content:"";position:absolute;z-index:4;left:0;right:0;bottom:0;height:52px;pointer-events:none;
  background:linear-gradient(180deg,rgba(240,240,243,0),rgba(240,240,243,.94))}

/* the blend lives on the positioned box itself: a transformed parent would trap it and leave the type white */
.headline{position:absolute;z-index:2;left:var(--gut);top:50%;transform:translateY(-66%);pointer-events:none;mix-blend-mode:difference}
.headline small{display:block;font:500 clamp(17px,1.55vw,23px)/1 var(--display);letter-spacing:-.015em;color:#87878a;margin:0 0 18px 5px}
.headline h1{font:700 clamp(62px,8.7vw,134px)/.9 var(--display);letter-spacing:-.055em;color:#fff}
.headline h1 span{display:block;overflow:hidden;padding:0 .08em .16em 0;margin-bottom:-.16em}
.headline h1 i{display:block;font-style:normal}

.copy{position:relative;z-index:4;align-self:end;padding:0 var(--gut) 7svh}
.copy p{font-size:17px;line-height:1.55;letter-spacing:-.012em;color:var(--grey);max-width:34ch}
.cta{margin-top:26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.link{font:500 16px/1 var(--text);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:6px}
.link b{font-weight:500;transition:transform .45s var(--ease)}
.link:hover b{transform:translateX(4px)}

.foot{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:0 var(--gut) 28px;font:500 13px/1 var(--text);color:var(--faint);letter-spacing:-.005em}

/* THE BULB SWITCHES ON, then breathes. Rays travel out from the head, one after another. */
.ray,.glint{transform-box:fill-box}
@media (prefers-reduced-motion:no-preference){
  .bulbwrap{animation:bulbIn 1.3s var(--ease) both}
  .ray,.glint{animation:rayOn .9s var(--ease) both,breathe 4.2s ease-in-out infinite alternate;
    animation-delay:calc(.75s + var(--i)*.09s),calc(1.9s + var(--i)*.35s)}
  .leon{animation:leonIn 1.25s var(--ease) .2s both}
  .headline h1 i{animation:lineIn 1.05s var(--ease) both}
  .headline h1 span:nth-child(1) i{animation-delay:.5s}
  .headline h1 span:nth-child(2) i{animation-delay:.6s}
  .headline small,.copy,.foot{animation:fadeUp 1s var(--ease) .8s both}
  .nav{animation:fadeUp 1s var(--ease) .05s both}
}
@keyframes bulbIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes rayOn{from{opacity:0;transform:translate(calc(var(--dx)*-2.4),calc(var(--dy)*-2.4)) scale(.5)}to{opacity:1;transform:none}}
@keyframes breathe{from{transform:none}to{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5))}}
@keyframes leonIn{from{opacity:0;transform:translateX(-50%) translateY(48px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes lineIn{from{transform:translateY(108%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:1100px){
  .nav nav a.l{display:none}
  .hero{grid-template-rows:auto auto auto 1fr}
  .headline{position:relative;top:auto;left:auto;transform:none;padding:40px var(--gut) 0}
  .headline h1{font-size:clamp(56px,15vw,112px)}
  .headline small{margin-left:2px}
  .copy{align-self:start;padding:22px var(--gut) 0}
  .stage{position:relative;left:auto;transform:none;justify-self:center;grid-row:4;align-self:end;--H:clamp(400px,60svh,640px);margin-top:4px}
  .foot{position:absolute;left:0;right:0;bottom:0;justify-content:center;padding-bottom:16px;color:var(--ink)}
  .foot span:first-child{display:none}
}
@media (max-width:560px){
  .nav{padding-top:16px}.nav .brand img{height:40px}
  .pill{height:40px;padding:0 17px;font-size:14px}
  .copy p{font-size:16px}
}
</style>

<script>
(function(){
  /* DEPTH: the mark and the man drift against each other by a few pixels. Pointer devices only,
     started after the entrance so the two never fight over one transform. */
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var hero=document.getElementById('hero'),bulb=document.getElementById('bulbwrap'),leon=document.getElementById('leon');
  var tx=0,ty=0,cx=0,cy=0,live=false;
  setTimeout(function(){bulb.style.animation='none';leon.style.animation='none';live=true;},1700);
  hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5;});
  (function tick(){cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;
    if(live){bulb.style.transform='translate('+(-cx*26)+'px,'+(-cy*16)+'px)';
      leon.style.transform='translateX(-50%) translate('+(cx*12)+'px,'+(cy*6)+'px)';}
    requestAnimationFrame(tick);})();
})();
</script>
