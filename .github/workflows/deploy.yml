# Builds the Astro site and publishes dist/ to GitHub Pages on every push to main.
# The two env values below are the ONLY things that change when the site moves
# to Leon's own domain: SITE_URL becomes the real domain and BASE_PATH
# becomes / (see astro.config.mjs and DEVELOPER.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://businessboosterlk.github.io
          BASE_PATH: /bswl
      # Blocks the deploy if any page scrolls sideways, throws an error, breaks the left edge or carries a dash.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
